name: Clean temporary transcript extraction files

on:
  push:
    paths:
      - '.github/workflows/cleanup-operators-transcript-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary extraction files
        run: |
          rm -f _temporary_operators_transcript_fetch_links_20260715.md
          rm -f .github/workflows/fetch-operators-transcripts.yml
          rm -f .github/workflows/discover-operators-portal-transcripts.yml
          rm -f .github/workflows/map-operators-episode-ids.yml
          rm -f .github/workflows/assemble-operators-transcript-archive.yml
          rm -f .github/workflows/cleanup-operators-transcript-temp.yml
          rm -rf operators_transcripts_20260715/_portal_discovered
          rm -f operators_transcripts_20260715/portal_discovery.json
          rm -f operators_transcripts_20260715/episode_id_snippets.json
          rm -f operators_transcripts_20260715/manifest.json
          rm -f operators_transcripts_20260715/portal_*.md
          cp operators_transcripts_20260715/final/README.md operators_transcripts_20260715/README.md
      - name: Commit cleaned archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Clean temporary transcript extraction files'
          git push
      - name: Delete temporary export branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete transcript-artifact-export-20260715 || true
