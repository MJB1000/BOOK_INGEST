name: Assemble Operators transcript archive

on:
  push:
    paths:
      - '.github/workflows/assemble-operators-transcript-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact six transcripts
        run: |
          cat > /tmp/assemble.py <<'PY'
          import json
          import re
          import shutil
          import zipfile
          from pathlib import Path

          root = Path('operators_transcripts_20260715')
          discovered = root / '_portal_discovered'
          final_dir = root / 'final'
          final_dir.mkdir(parents=True, exist_ok=True)

          episodes = [
              (1, 'cmrkyj21z000e04lauo41ge1t', 'QXd5NoEFY0o', 'The Performance Creative Director Hire: Operator vs. Ideator'),
              (2, 'cmrayfuti009b04kzgjjm7ra0', 'auKUEvA_R8o', 'Big-Swing vs. Incremental: Our Ecommerce CRO Testing Framework'),
              (3, 'cmr0psblp004m04jpkm6ghck5', 'Qj5d_YVNOC4', 'The Right Way to A/B Test Landing Pages on Meta Ads for Ecommerce'),
              (4, 'cmqqy9xku000t04kv2yivk73o', 'cBbsDGG65RI', 'How to 2x Your A/B Testing Output Without More Budget'),
              (5, 'cmqgy6yfg005y04l729qjvwzo', 'Wh8RW4NA5_A', 'The DTC Content Creation Process That Wins on Paid Social'),
              (6, 'cmq6l8noi000g04jvlks2f65m', 'lADnv3AtRvk', 'How AI Is Reshaping Ecommerce Growth Teams: HexClad & Jones Road'),
          ]

          def slug(value):
              return re.sub(r'[^A-Za-z0-9]+', '-', value).strip('-')[:120]

          def clean_jina(text):
              marker = 'Markdown Content:'
              if marker in text:
                  text = text.split(marker, 1)[1]
              text = text.strip()
              # Remove portal navigation if Jina included it before the transcript.
              if '\nTranscript\n' in text:
                  text = text.split('\nTranscript\n', 1)[1]
              return text.strip() + '\n'

          manifest = []
          combined_parts = ['# Marketing Operators: Six Full Transcripts\n']
          for position, episode_id, youtube_id, title in episodes:
              candidates = list(discovered.glob(f'*_{episode_id}_*.md'))
              if not candidates:
                  raise FileNotFoundError(f'No discovered portal transcript for {episode_id}')
              source = candidates[0]
              text = clean_jina(source.read_text(encoding='utf-8'))
              filename = f'{position:02d}_{slug(title)}.md'
              target = final_dir / filename
              header = (
                  f'# {title}\n\n'
                  f'- Portal episode ID: `{episode_id}`\n'
                  f'- YouTube video ID: `{youtube_id}`\n'
                  f'- Portal URL: https://portal.9operators.com/episodes/{episode_id}\n'
                  f'- YouTube URL: https://www.youtube.com/watch?v={youtube_id}\n\n'
                  '## Full transcript\n\n'
              )
              target.write_text(header + text, encoding='utf-8')
              manifest.append({
                  'position': position,
                  'title': title,
                  'episode_id': episode_id,
                  'youtube_id': youtube_id,
                  'file': str(target),
                  'characters': len(text),
              })
              combined_parts.append(header + text + '\n---\n')

          combined = root / 'Marketing_Operators_Six_Full_Transcripts.md'
          combined.write_text('\n'.join(combined_parts), encoding='utf-8')

          readme = final_dir / 'README.md'
          readme.write_text(
              '# Marketing Operators transcript archive\n\n'
              'Six full, speaker-labelled transcripts pulled from the Operators Network portal on 15 July 2026.\n\n'
              + '\n'.join(f"{e['position']}. [{e['title']}]({Path(e['file']).name})" for e in manifest)
              + '\n',
              encoding='utf-8',
          )
          (root / 'final_manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')

          zip_path = root / 'Marketing_Operators_Transcripts_20260715.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(final_dir.glob('*.md')):
                  zf.write(path, arcname=path.name)
              zf.write(combined, arcname=combined.name)
              zf.write(root / 'final_manifest.json', arcname='final_manifest.json')

          print(json.dumps(manifest, indent=2))
          print(f'Created {zip_path} ({zip_path.stat().st_size} bytes)')
          PY
          python /tmp/assemble.py
      - name: Commit final archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operators_transcripts_20260715
          git diff --cached --quiet && exit 0
          git commit -m 'Assemble final Marketing Operators transcript archive'
          git push
