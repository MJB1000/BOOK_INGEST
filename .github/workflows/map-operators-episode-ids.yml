name: Map Operators episode IDs

on:
  push:
    paths:
      - '.github/workflows/map-operators-episode-ids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Save snippets around episode IDs
        run: |
          cat > /tmp/map_ids.py <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          import requests

          out = Path('operators_transcripts_20260715')
          out.mkdir(exist_ok=True)
          urls = [
              'https://portal.9operators.com/library?show=mkt_ops',
              'https://portal.9operators.com/library',
              'https://portal.9operators.com/',
          ]
          documents = []
          for url in urls:
              r = requests.get(url, timeout=60, headers={'User-Agent':'Mozilla/5.0'})
              documents.append({'url': url, 'text': r.text})

          ids = []
          for document in documents:
              raw = document['text']
              for pattern in [r'/episodes/([a-z0-9]{20,40})', r'\\/episodes\\/([a-z0-9]{20,40})']:
                  for episode_id in re.findall(pattern, raw, flags=re.I):
                      episode_id = episode_id.lower()
                      if episode_id not in ids:
                          ids.append(episode_id)

          mapped = []
          for episode_id in ids:
              snippets = []
              for document in documents:
                  raw = document['text']
                  starts = [m.start() for m in re.finditer(re.escape(episode_id), raw, flags=re.I)]
                  for start in starts[:5]:
                      snippet = raw[max(0,start-1500):min(len(raw),start+2500)]
                      snippet = html.unescape(snippet)
                      snippets.append({'source':document['url'], 'snippet':snippet})
              mapped.append({'episode_id': episode_id, 'snippets': snippets})

          (out / 'episode_id_snippets.json').write_text(json.dumps(mapped, indent=2), encoding='utf-8')
          PY
          python /tmp/map_ids.py
      - name: Commit mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operators_transcripts_20260715/episode_id_snippets.json
          git diff --cached --quiet && exit 0
          git commit -m 'Map Operators episode IDs to library metadata'
          git push
